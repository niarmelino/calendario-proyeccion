<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario de proyección</title>
<meta name="description" content="Calendario de turnos de proyección. Consultá los próximos fines de semana y quién cubre cada turno (sábado tarde, domingo mañana y tarde).">
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Calendario de proyección">
<meta property="og:description" content="Calendario de turnos de proyección. Consultá los próximos fines de semana y quién cubre cada turno (sábado tarde, domingo mañana y tarde).">
<meta property="og:locale" content="es_AR">
<!-- Twitter -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Calendario de proyección">
<meta name="twitter:description" content="Calendario de turnos de proyección. Consultá los próximos fines de semana y quién cubre cada turno (sábado tarde, domingo mañana y tarde).">
<meta name="theme-color" content="#1e1e1e">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="page-header">
    <h1 class="page-header__title">Calendario de proyección</h1>
  </header>

  <main id="schedule" class="schedule"></main>
</div>

<script>
// Los turnos viven en data.json. Para sumar o cambiar una semana, editá ese
// archivo: esta página se genera sola al cargar.
const DATA_URL = 'data.json';

const root = document.getElementById('schedule');

const esc = txt => String(txt ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

// "2026-09-27" se parsea como UTC si se pasa tal cual, lo que corre un día el
// filtro en horarios negativos (ej. Argentina). Con T00:00:00 es hora local.
function aFechaLocal(iso){
  const d = new Date(`${iso}T00:00:00`);
  return Number.isNaN(d.getTime()) ? null : d;
}

function hoyLocal(){
  const ahora = new Date();
  return new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
}

// El finde siempre tiene los mismos tres momentos: sábado a la tarde y
// domingo a la mañana y a la tarde. Cada uno lo cubre una sola persona.
const TURNOS = [
  { clave: 'sabadoTarde', dia: 'sabado', etiqueta: 'Tarde' },
  { clave: 'domingoManana', dia: 'domingo', etiqueta: 'Mañana' },
  { clave: 'domingoTarde', dia: 'domingo', etiqueta: 'Tarde' }
];

function sumarDias(fecha, dias){
  const d = new Date(fecha);
  d.setDate(d.getDate() + dias);
  return d;
}

function fechaIso(fecha){
  const anio = fecha.getFullYear();
  const mes = String(fecha.getMonth() + 1).padStart(2, '0');
  const dia = String(fecha.getDate()).padStart(2, '0');
  return `${anio}-${mes}-${dia}`;
}

function rangoFinde(domingo){
  const sabado = sumarDias(domingo, -1);
  const mismoMes = sabado.getMonth() === domingo.getMonth()
    && sabado.getFullYear() === domingo.getFullYear();
  const mes = domingo.toLocaleDateString('es-AR', { month: 'long' });
  if (mismoMes) return `${sabado.getDate()} y ${domingo.getDate()} de ${mes}`;
  const desde = sabado.toLocaleDateString('es-AR', { day: 'numeric', month: 'long' });
  const hasta = domingo.toLocaleDateString('es-AR', { day: 'numeric', month: 'long' });
  return `${desde} y ${hasta}`;
}

function personaDe(turnos, clave){
  const valor = turnos && turnos[clave];
  return typeof valor === 'string' ? valor.trim() : '';
}

function turnoHTML(turno, turnos){
  const nombre = personaDe(turnos, turno.clave);
  return `<div class="shift">
      <span class="shift__moment">${turno.etiqueta}</span>
      <span class="shift__person${nombre ? '' : ' shift__person--empty'}">${nombre ? esc(nombre) : 'Sin asignar'}</span>
    </div>`;
}

function diaHTML(dia, turnos){
  return `<section class="day day--${dia.clave}">
      <h3 class="day__title">
        <span class="day__name">${dia.nombre}</span>
        <time class="day__date" datetime="${fechaIso(dia.fecha)}">${dia.fecha.getDate()}</time>
      </h3>
      <div class="day__shifts">
        ${dia.turnos.map(turno => turnoHTML(turno, turnos)).join('')}
      </div>
    </section>`;
}

function semanaHTML(sem, domingo){
  const sabado = sumarDias(domingo, -1);
  const turnos = (sem.turnos && typeof sem.turnos === 'object' && !Array.isArray(sem.turnos))
    ? sem.turnos
    : null;
  const hayTurnos = turnos && Object.keys(turnos).length > 0;
  const titulo = (typeof sem.titulo === 'string' && sem.titulo.trim())
    ? esc(sem.titulo)
    : rangoFinde(domingo);
  const dias = [
    { clave: 'sabado', nombre: 'Sábado', fecha: sabado, turnos: TURNOS.filter(t => t.dia === 'sabado') },
    { clave: 'domingo', nombre: 'Domingo', fecha: domingo, turnos: TURNOS.filter(t => t.dia === 'domingo') }
  ];
  // Un finde sin turnos se carga con "turnos": {} y se avisa que no hay.
  const cuerpo = hayTurnos
    ? `<div class="week__days">${dias.map(dia => diaHTML(dia, turnos)).join('')}</div>`
    : '<p class="notice">Turnos en construcción...</p>';
  return `
  <section class="week">
    <h2 class="week__title">${titulo}</h2>
    ${cuerpo}
  </section>
`;
}

function estadoHTML(titulo, detalle){
  return `
  <section class="week">
    <h2 class="week__title">${esc(titulo)}</h2>
    <p class="notice">${detalle}</p>
  </section>
`;
}

function render(data){
  const hoy = hoyLocal();
  const semanas = (data && Array.isArray(data.semanas)) ? data.semanas : [];

  const futuras = semanas
    .map(sem => ({ sem, fecha: aFechaLocal(sem && sem.fecha) }))
    .filter(item => item.fecha && item.fecha.getTime() >= hoy.getTime())
    .sort((a, b) => a.fecha - b.fecha);

  if (futuras.length === 0){
    root.innerHTML = estadoHTML(
      'Sin turnos programados',
      `No hay semanas cargadas con fecha igual o posterior a hoy (${esc(hoy.toLocaleDateString('es-AR'))}).`
    );
    return;
  }
  root.innerHTML = futuras.map(item => semanaHTML(item.sem, item.fecha)).join('');
}

async function cargar(){
  root.innerHTML = estadoHTML('Cargando…', 'Buscando los turnos de la semana.');
  try {
    // no-store para que los cambios en data.json se vean al recargar la página.
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
  } catch (err) {
    root.innerHTML = estadoHTML(
      'No se pudieron cargar los turnos',
      `No se pudo leer <code>${esc(DATA_URL)}</code>. Verificá que el archivo exista y esté junto al <code>index.html</code>.`
    );
    console.error(err);
  }
}

cargar();
</script>
</body>
</html>
